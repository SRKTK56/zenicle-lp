<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>応援アルバム（マイページ） モック v2 | ゼニくる デザイン</title>
<!--
  マイページのコレクション（/me/stamps）を「応援アルバム」に作り直す案。
  決めたこと（2026-10-02）: 中心はリーグごとの「棚」／公式スタンプは図鑑で、未所持はシルエット（特典・あおり文言なし）
  ／金額は出さない（応援履歴で確認）／称号あり・賞品なし（無料のいいねで取れる称号も混ぜる）
  データはすべて架空（demo-assets.js の架空チーム）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=20261002">
<style>
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  header.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
  header.top img{height:28px;display:block}
  .me-tabs{display:flex;gap:4px;margin-left:12px}
  .me-tabs a{text-decoration:none;font-size:.875rem;font-weight:700;color:var(--ink-muted);padding:8px 12px;border-radius:var(--r-pill);white-space:nowrap}
  .me-tabs a[aria-current]{background:var(--blush);color:var(--heat-text)}
  .who-am{margin-left:auto;font-size:.875rem;font-weight:700;color:var(--ink-muted)}
  @media (max-width:640px){.who-am{display:none}.me-tabs{margin-left:0;gap:0}.me-tabs a{padding:7px 9px;font-size:.8125rem}header.top .wrap{gap:10px}}

  /* ---------- 表紙：アルバムのタイトルと数 ---------- */
  .cover{padding:34px 0 10px}
  .cover .kicker{font-family:var(--font-num);font-weight:600;letter-spacing:.14em;font-size:.875rem;color:var(--heat-text)}
  .cover h1{margin:4px 0 0;font-size:clamp(1.9rem,4.4vw,2.8rem);font-weight:900;line-height:1.2}
  .cover h1 .heat-text{display:inline-block}
  .counts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:16px}
  .counts div{line-height:1.1}
  .counts b{display:block;font-family:var(--font-num);font-weight:800;font-size:2.1rem}
  .counts span{font-size:.875rem;color:var(--ink-muted)}

  /* ---------- 称号 ---------- */
  .badges{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:thin}
  .bdg{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px 6px 6px;box-shadow:var(--shadow-card);font-size:.875rem;font-weight:900;white-space:nowrap}
  .bdg i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.95rem;color:#fff;background:var(--heat-grad-btn)}
  .bdg small{display:block;font-weight:500;color:var(--ink-muted);font-size:.75rem}
  .bdg.mvp i{background:var(--night);color:#FFC857;font-family:var(--font-num);font-size:.7rem;font-weight:800}
  .bdg.free i{background:var(--heat-3)}

  h2.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px;font-size:1.375rem;font-weight:900}
  h2.sec small{font-size:.875rem;font-weight:500;color:var(--ink-muted)}

  /* ---------- 公式スタンプの図鑑（未所持はシルエット。あおらない） ---------- */
  .zukan{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow-card)}
  .zk{position:relative;text-align:center;padding:8px 4px 10px;border-radius:14px;background:var(--canvas)}
  .zk img{width:100%;max-width:92px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto}
  .zk .nm{font-weight:900;font-size:.875rem;margin-top:4px}
  .zk .ct{position:absolute;right:6px;top:6px;font-family:var(--font-num);font-weight:800;font-size:.95rem;background:var(--heat-grad-btn);color:#fff;border-radius:var(--r-pill);padding:0 8px}
  .zk.none img{filter:brightness(0);opacity:.12}
  .zk.none .nm{color:var(--ink-subtle);font-weight:700}
  @media (max-width:520px){.zukan{grid-template-columns:repeat(3,1fr)}.zk .nm{font-size:.8125rem}}

  /* ---------- リーグの棚 ---------- */
  .shelf{border-radius:var(--r-card);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);border:1px solid var(--line);margin-bottom:18px}
  .sh-head{position:relative;color:#fff;padding:18px 20px;background:var(--night)}
  .sh-head::before{content:"";position:absolute;inset:0;background:url(img/bg-ballpark.jpg) center 40%/cover;opacity:.45}
  .sh-head::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,21,48,.92),rgba(11,21,48,.55))}
  .sh-head>*{position:relative;z-index:1}
  .sh-head .st{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:900;background:#fff;color:var(--heat-text);border-radius:var(--r-pill);padding:2px 10px}
  .sh-head .st i{width:7px;height:7px;border-radius:50%;background:var(--heat-3)}
  .sh-head .st.end{color:var(--ink)}
  .sh-head .st.end i{background:var(--ink-subtle)}
  .sh-head h3{margin:8px 0 2px;font-size:1.25rem;font-weight:900}
  .sh-head p{margin:0;font-size:.875rem;color:rgba(255,255,255,.8)}
  .teams{list-style:none;margin:0;padding:6px 0}
  .tm{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
  .tm:first-child{border-top:0}
  .tm .emb{width:52px;height:52px}
  .tm .emb svg{width:100%;height:100%;display:block}
  .tm .nm{font-weight:900;font-size:1.0625rem}
  .tm .rank{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:.875rem;color:var(--ink-muted)}
  .tm .rank b{font-family:var(--font-num);font-style:italic;font-weight:800;font-size:1.25rem;color:var(--heat-text)}
  .tm .rank .win{font-size:.75rem;font-weight:900;color:#fff;background:var(--heat-grad-btn);border-radius:var(--r-pill);padding:1px 9px}
  .tm .like{font-size:.8125rem;color:var(--ink-muted);margin-top:2px}
  /* 送ったスタンプは、シールを重ねたように見せる。押すと詳しく見られる */
  .stk{display:flex;align-items:center}
  .stk button{appearance:none;border:0;background:none;padding:0;margin-left:-14px;cursor:pointer;position:relative;transition:transform var(--dur-fast) var(--ease-pop)}
  .stk button:first-child{margin-left:0}
  .stk button:hover{transform:translateY(-6px) rotate(-4deg);z-index:2}
  .stk img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(11,21,48,.18))}
  .stk .x{position:absolute;right:-2px;bottom:-2px;font-family:var(--font-num);font-weight:800;font-size:.8rem;background:var(--night);color:#fff;border-radius:var(--r-pill);padding:0 6px}
  @media (max-width:640px){.tm{grid-template-columns:44px minmax(0,1fr)}.tm .emb{width:44px;height:44px}.stk{grid-column:1/-1;margin-top:4px}.stk img{width:50px;height:50px}}

  /* ---------- 最近の応援 ---------- */
  .tl{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card)}
  .tl li{display:grid;grid-template-columns:64px 40px 1fr;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:.9375rem}
  .tl li:first-child{border-top:0}
  .tl .d{font-family:var(--font-num);font-weight:600;color:var(--ink-subtle);font-size:.875rem}
  .tl img{width:40px;height:40px;object-fit:contain}
  .tl b{font-weight:900}
  .note{font-size:.875rem;color:var(--ink-muted);line-height:1.8;margin:14px 0 0}
  .note a{color:var(--heat-text);font-weight:700}

  /* ---------- スタンプの詳細 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(11,21,48,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--dur-mid)}
  .scrim.on{opacity:1;pointer-events:auto}
  .detail{position:fixed;z-index:61;left:50%;top:50%;width:min(360px,92vw);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;background:#fff;border-radius:24px;padding:22px;text-align:center;transition:all var(--dur-mid) var(--ease-pop)}
  .detail.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
  .detail img{width:180px;height:180px;object-fit:contain}
  .detail h4{margin:6px 0 0;font-size:1.25rem;font-weight:900}
  .detail .to{margin-top:4px;color:var(--ink-muted);font-size:.9375rem}
  .detail ul{list-style:none;margin:12px 0 0;padding:0;font-size:.875rem;color:var(--ink-muted);line-height:1.8}
  .detail .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .detail .btn{padding:10px 18px;font-size:.875rem}
  footer{padding:30px 0 40px;text-align:center;font-size:.75rem;color:var(--ink-subtle)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="../../logo.png" alt="ゼニくる">
  <nav class="me-tabs" aria-label="マイページ"><a href="#" aria-current="page">応援アルバム</a><a href="#">応援履歴</a><a href="#">プロフィール</a></nav>
  <span class="who-am">さくら さん</span>
</div></header>

<main class="wrap">
  <section class="cover">
    <div class="kicker">My yell album</div>
    <h1>さくらさんの<br><span class="heat-text">応援アルバム</span></h1>
    <div class="counts" id="counts"></div>
    <div class="badges" id="badges" aria-label="称号"></div>
  </section>

  <h2 class="sec">公式スタンプ図鑑 <small id="zkNote"></small></h2>
  <div class="zukan" id="zukan"></div>

  <h2 class="sec">リーグの棚 <small>応援したリーグとチーム</small></h2>
  <div id="shelves"></div>

  <h2 class="sec">最近の応援</h2>
  <ul class="tl" id="tl"></ul>
  <p class="note">応援した金額は <a href="#">応援履歴</a> で確かめられます。アルバムは、集めた数と思い出だけを残します。</p>
</main>
<footer>このページはマイページの作り直し案（モック）です。リーグ・チーム・応援はすべて架空です。</footer>

<div class="scrim" id="scrim"></div>
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dtName">
  <img id="dtImg" alt="">
  <h4 id="dtName"></h4>
  <div class="to" id="dtTo"></div>
  <ul id="dtList"></ul>
  <div class="row"><a class="btn btn-ghost" id="dtDl" download>画像を保存</a><button class="btn btn-heat" id="dtClose" type="button">閉じる</button></div>
</div>

<script src="demo-assets.js?v=20261002"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('ja-JP');
const OFFICIAL={1:['旗ふり','../stamps/512/lv1_supporter.png'],2:['メダル','../stamps/512/lv2_big_supporter.png'],3:['メガホン','../stamps/512/lv3_fan.png'],4:['ヒーロー','../stamps/512/lv4_super_fan.png'],5:['王冠','../stamps/512/lv5_legend.png']};
const teamStamp=(id,key)=>{const t=TEAM_STAMPS.find(x=>x.key===key);return {name:t.name,img:svgURI(t.draw(id)),original:true}};
const off=n=>({name:OFFICIAL[n][0],img:OFFICIAL[n][1],lv:n});

/* ===== 架空の応援の記録（金額は持たせない＝画面に出さない） ===== */
const SEASONS=[
  {name:'ソラミズ飲料杯 応援ランキング',league:'南風ベースボールリーグ',status:'live',sub:'開催中 ・ 中間発表まで あと12日',
   teams:[
     {id:'A',rank:1,likes:21,given:[[off(5),[ '10/1']],[off(3),['9/28','9/30']],[teamStamp('A','nice'),['9/27']]]},
     {id:'B',rank:2,likes:9,given:[[off(2),['9/26','9/29','10/1']]]},
   ]},
  {name:'第1回 南風カップ 応援ランキング',league:'南風ベースボールリーグ',status:'end',sub:'2026年6月〜8月 ・ 終了',
   teams:[
     {id:'A',rank:1,final:true,likes:16,mvp:true,given:[[off(5),['8/20']],[off(3),['7/12','8/02']],[teamStamp('A','thx'),['8/31']]]},
     {id:'C',rank:3,final:true,likes:5,given:[[off(1),['6/18','7/03']],[teamStamp('C','win'),['7/20']]]},
   ]},
];
const BADGES=[
  {i:'1',t:'はじめての応援',s:'2026/6/18'},
  {i:'MVP',t:'MVP サポーター',s:'第1回 南風カップ・あかつきフォクシーズ',cls:'mvp'},
  {i:'♡',t:'いいね 7日連続',s:'無料のいいねで達成',cls:'free'},
  {i:'2',t:'2つのリーグを応援',s:''},
  {i:'3',t:'3チームを応援',s:''},
];

/* ===== 描画 ===== */
const allGiven=SEASONS.flatMap(s=>s.teams.flatMap(t=>t.given.map(([st,dates])=>({st,dates,team:t.id,season:s}))));
const stampCount=allGiven.reduce((n,g)=>n+g.dates.length,0);
const teamIds=new Set(SEASONS.flatMap(s=>s.teams.map(t=>t.id)));
const likeDays=SEASONS.flatMap(s=>s.teams).reduce((n,t)=>n+t.likes,0);
$('#counts').innerHTML=[[SEASONS.length,'応援したリーグ'],[teamIds.size,'応援したチーム'],[stampCount,'集めたスタンプ'],[likeDays,'いいねした日']].map(([v,k])=>`<div><b>${fmt(v)}</b><span>${k}</span></div>`).join('');
$('#badges').innerHTML=BADGES.map(b=>`<div class="bdg ${b.cls||''}"><i>${b.i}</i><div>${b.t}${b.s?`<small>${b.s}</small>`:''}</div></div>`).join('');

// 図鑑：公式5種。持っている数を出し、未所持はシルエット（「あと◯種」のような文言は出さない）
const owned={};allGiven.forEach(g=>{if(g.st.lv)owned[g.st.lv]=(owned[g.st.lv]||0)+g.dates.length});
$('#zukan').innerHTML=[1,2,3,4,5].map(n=>{const c=owned[n]||0,[nm,img]=OFFICIAL[n];
  return `<div class="zk${c?'':' none'}">${c?`<span class="ct">×${c}</span>`:''}<img src="${img}" alt="${c?nm:'まだ持っていないスタンプ'}"><div class="nm">${c?nm:'？？？'}</div></div>`}).join('');
$('#zkNote').textContent=`${Object.keys(owned).length} / 5 種`;

// 棚
let SEQ=0;const DETAIL={};
$('#shelves').innerHTML=SEASONS.map(s=>`<section class="shelf"><div class="sh-head"><span class="st ${s.status==='end'?'end':''}"><i></i>${s.status==='end'?'終了':'開催中'}</span><h3>${s.name}</h3><p>${s.league} ・ ${s.sub}</p></div>
  <ul class="teams">${s.teams.map(t=>{const m=TEAM_META[t.id];
    const rk=t.final?(t.rank===1?`最終 <b>1</b> 位 <span class="win">優勝</span>`:`最終 <b>${t.rank}</b> 位`):`いま <b>${t.rank}</b> 位`;
    return `<li class="tm"><div class="emb">${emblemSVG(t.id)}</div><div><div class="nm">${m.name}</div><div class="rank">${rk}</div><div class="like">♡ いいね ${t.likes}回${t.mvp?' ・ あなたは MVP サポーター':''}</div></div>
      <div class="stk">${t.given.map(([st,dates])=>{const k='d'+(SEQ++);DETAIL[k]={st,dates,team:m.name,season:s.name};return `<button type="button" data-d="${k}" aria-label="${st.name}（${dates.length}枚）を詳しく見る"><img src="${st.img}" alt="">${dates.length>1?`<span class="x">×${dates.length}</span>`:''}</button>`}).join('')}</div></li>`}).join('')}</ul></section>`).join('');

// 最近の応援（日付の新しい順・5件）
const flat=allGiven.flatMap(g=>g.dates.map(d=>({d,g}))).filter(x=>x.g.season.status==='live').sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
$('#tl').innerHTML=flat.map(({d,g})=>`<li><span class="d">${d}</span><img src="${g.st.img}" alt=""><span><b>${TEAM_META[g.team].name}</b>に「${g.st.name}」で応援</span></li>`).join('');

// 詳細
function openD(k){const x=DETAIL[k];$('#dtImg').src=x.st.img;$('#dtName').textContent=x.st.name+(x.st.original?'（チームオリジナル）':'');
  $('#dtTo').textContent=`${x.team} へ ・ ${x.dates.length}枚`;$('#dtList').innerHTML=x.dates.map(d=>`<li>${d} ・ ${x.season}</li>`).join('');
  $('#dtDl').href=x.st.img;$('#dtDl').setAttribute('download',x.st.name+(x.st.img.startsWith('data:')?'.svg':'.png'));
  $('#scrim').classList.add('on');$('#detail').classList.add('on')}
function closeD(){$('#scrim').classList.remove('on');$('#detail').classList.remove('on')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)openD(b.dataset.d)});
$('#scrim').onclick=closeD;$('#dtClose').onclick=closeD;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
</script>
</body>
</html>
